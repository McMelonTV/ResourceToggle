name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.1)'
        required: true
        type: string
      changelog:
        description: 'Changelog for this release'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Update mod version
        run: sed -i "s/^mod_version=.*/mod_version=${{ inputs.version }}/" gradle.properties

      - name: Build
        run: ./gradlew build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: ResourceToggle v${{ inputs.version }}
          body: ${{ inputs.changelog }}
          files: build/libs/*.jar
